services:
  snipeit-watcher:
    build: .
    container_name: snipeit-watcher
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: info
      APP_URL: https://snipeit.example.com
      SNIPEIT_API_TOKEN: change-me
      WATCHER_INTERVAL: 300
      DISABLED_USERS_ID_WHITELIST: "[]"
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 25
      MAIL_FROM_ADDR: snipeit@example.com
      MAIL_FROM_NAME: Snipe-IT Watcher
    # Alternatively load the settings from a .env file:
    # env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
